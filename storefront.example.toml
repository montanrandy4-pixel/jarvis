# Storefront agent settings. Merge this into your existing shop.toml --
# both agents read the same file and neither reads the other's keys.

[shop]
store_domain = "wwt2sq-wi.myshopify.com"
api_version = "2026-01"
# The token itself lives in the environment, never in this file:
#   export SHOPIFY_ADMIN_TOKEN=shpat_...
token_env = "SHOPIFY_ADMIN_TOKEN"

[storefront]
# Flag any order at or above this. On a store selling files, an unusually
# large order more often means card testing than a good day.
review_above = 250.0

# Where the product files live on your machine.
assets_dir = "~/solostack/deliverables"

# How often the watch takes a pass.
interval_minutes = 60

# --- Alerts ---
# Do not repeat the same alert inside this window. The point of a watcher is
# that you still read it in a month.
alert_cooldown_minutes = 60

# Native desktop notification (macOS osascript / Linux notify-send).
alert_desktop = true

# Slack, Discord, or anything that accepts {"text": "..."}.
# alert_webhook = "https://hooks.slack.com/services/..."

# Browser checks drive a real Chromium, so they run on their own slower clock.
browser_checks = true
storefront_check_minutes = 60

# --- Phone ---
# Text alerts and inbound calls run through Twilio. Credentials AND your phone
# number come from the environment, never from this file -- this repository may
# be public, and a phone number in a public repo is scraped within days.
#
#   export TWILIO_ACCOUNT_SID=AC...
#   export TWILIO_AUTH_TOKEN=...
#   export TWILIO_FROM_NUMBER=+1XXXXXXXXXX     # the number Twilio gave you
#   export ALERT_SMS_TO=+1XXXXXXXXXX           # your mobile
#
# Only alerts at or above this severity are worth a buzz in your pocket.
alert_sms_min = "critical"

# For inbound calls: the public HTTPS URL Twilio posts to. Must match exactly
# what you configured in Twilio, including scheme and path. Leave it empty and
# every inbound call is refused, which is the safe default.
# voice_public_url = "https://your-tunnel.example.com"

# Email is off unless you fill this in. Use an app password, not your own.
# [storefront.alert_email]
# to = "you@example.com"
# host = "smtp.gmail.com"
# port = 587
# username = "you@example.com"
# password = "app-password-here"

# SKU -> filename, relative to assets_dir. These are the 14 products already
# in the store; the filenames match what was delivered.
[storefront.assets]
"SS-CONTRACT-PACK"   = "The Freelance Contract Pack.zip"
"SS-PROPOSAL-KIT"    = "The Proposal Kit.zip"
"SS-ONBOARD-NOTION"  = "Client Onboarding System.zip"
"SS-CRM-NOTION"      = "Freelance CRM and Pipeline Tracker.zip"
"SS-INVOICE-SYS"     = "Invoice and Payment Chase System.zip"
"SS-RATE-CALC"       = "Rate Calculator and Pricing Toolkit.xlsx"
"SS-TAX-TRACKER"     = "Tax and Expense Tracker.xlsx"
"SS-SCOPE-KIT"       = "Scope Creep Defense Kit.zip"
"SS-PORTFOLIO"       = "Portfolio and Case Study Pack.zip"
"SS-OUTREACH-50"     = "Cold Outreach Scripts.zip"
"SS-CONTENT-90"      = "90-Day Content Calendar.zip"
