<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#0c2735"/>
      <stop offset=".55" stop-color="#06121a"/>
      <stop offset="1" stop-color="#02060a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#c9f8ff"/>
      <stop offset=".7" stop-color="#5ee7ff"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect class="plate" width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="none" stroke="#5ee7ff" filter="url(#glow)">
    <circle cx="256" cy="256" r="178" stroke-width="9"/>
    <circle cx="256" cy="256" r="156" stroke-width="10" stroke-opacity=".55"
            stroke-dasharray="3 13.34"/>
    <circle cx="256" cy="256" r="118" stroke-width="40" stroke="#9ff3ff"
            stroke-opacity=".9" stroke-dasharray="58 16.14"
            transform="rotate(-90 256 256)"/>
    <circle cx="256" cy="256" r="84" stroke-width="5"/>
  </g>
  <circle cx="256" cy="256" r="74" fill="url(#core)" filter="url(#glow)"/>
</svg>
